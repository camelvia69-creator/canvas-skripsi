<title>Research Canvas Skripsi – AR Kivicube + STEM</title>
<style>
:root{--bg:#f3f1ea;--sf:#fffefb;--tx:#1b2622;--mu:#58665f;--ac:#0b6b62;--ac2:#e3f0ed;--bd:#d9d4c6;--hl:#b45309;--sh:0 2px 18px rgba(20,40,35,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1513;--sf:#17201d;--tx:#e9f0ed;--mu:#a1b1ab;--ac:#4fd1c0;--ac2:#162e2a;--bd:#2a3935;--hl:#fb923c;--sh:none}}
:root[data-theme="dark"]{--bg:#0f1513;--sf:#17201d;--tx:#e9f0ed;--mu:#a1b1ab;--ac:#4fd1c0;--ac2:#162e2a;--bd:#2a3935;--hl:#fb923c;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.75 Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
.bar{position:sticky;top:0;z-index:9;background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px;overflow-x:auto}
.bar button,.foot button{font:600 14px system-ui,sans-serif;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px 15px;border-radius:999px;cursor:pointer;white-space:nowrap}
.bar button.on{background:var(--ac);color:var(--sf);border-color:var(--ac)}
.bar .sp{flex:1}
.bar .brand{font:600 12px system-ui,sans-serif;color:var(--mu);white-space:nowrap}
.prog{height:3px;background:var(--bd)}.prog i{display:block;height:100%;background:var(--ac);transition:width .25s}
main{max-width:1180px;margin:auto;padding:22px 18px 100px}
.cover{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:clamp(22px,5vw,48px);box-shadow:var(--sh);margin-bottom:22px}
.eyebrow{font:700 13px system-ui,sans-serif;letter-spacing:.16em;color:var(--ac)}
.cover h1{font-size:clamp(22px,3.6vw,34px);line-height:1.35;margin:14px 0 16px;text-align:justify;hyphens:auto}
.meta{color:var(--mu);font:15px/1.6 system-ui,sans-serif}
.btn{display:inline-block;margin-top:20px;font:700 15px system-ui,sans-serif;background:var(--ac);color:var(--sf);border:0;padding:12px 22px;border-radius:12px;cursor:pointer}
.hint{font:14px system-ui,sans-serif;color:var(--mu);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;cursor:pointer;color:var(--tx);font:inherit;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--ac);outline:none}
.card h3{margin:2px 0 8px;font:700 19px system-ui,sans-serif}
.card .n{display:inline-block;font:700 13px system-ui,sans-serif;background:var(--ac2);color:var(--ac);padding:2px 10px;border-radius:99px}
.card p{margin:0;font-size:15px;line-height:1.6;color:var(--mu);text-align:justify;hyphens:auto}
.page{background:var(--sf);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:clamp(20px,4vw,44px)}
.page h2{font:800 clamp(22px,3.2vw,32px)/1.3 system-ui,sans-serif;margin:0 0 6px;padding-left:16px;border-left:6px solid var(--ac)}
.sub{font:italic 17px/1.55 Georgia,serif;color:var(--mu);margin:0 0 22px;padding-left:22px}
.page p,.page li,.cover h1{text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.page p{margin:0 0 14px}
.page ol,.page ul{padding-left:26px;margin:0 0 14px}
.page li{margin:0 0 12px;padding-left:4px}
.page ol li::marker{color:var(--ac);font-weight:700}
.call{background:var(--ac2);border-left:4px solid var(--ac);padding:12px 16px;border-radius:0 10px 10px 0}
.cols{display:grid;gap:18px;align-items:start}
.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}
.col{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:18px 20px}
.col h3{font:700 18px/1.35 system-ui,sans-serif;color:var(--ac);margin:0 0 12px}
.col p:last-child{margin-bottom:0}
.cols{font-size:17px;line-height:1.7}
.split{display:grid;grid-template-columns:minmax(260px,38%) 1fr;gap:26px;align-items:start}
.fig{width:100%;height:auto;border-radius:12px;border:1px solid var(--bd);background:#fff}
.tw{overflow-x:auto;margin:6px 0 18px}
table{border-collapse:collapse;width:100%;font:16px/1.55 system-ui,sans-serif;min-width:560px}
th,td{border:1px solid var(--bd);padding:10px 12px;text-align:left;vertical-align:top}
th{background:var(--ac);color:var(--sf)}
td.f{background:var(--ac);min-width:44px}
tr:nth-child(even) td:not(.f){background:var(--ac2)}
.refs{list-style:none;padding:0!important}
.refs li{padding-left:2.2em;text-indent:-2.2em;font-size:16px;line-height:1.65}
.refs li.d{color:var(--tx)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--sf);border-top:1px solid var(--bd);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center}
.foot .pg{font:600 14px system-ui,sans-serif;color:var(--mu);min-width:70px;text-align:center}
.foot button:disabled{opacity:.35;cursor:default}
.foot .go{background:var(--ac);color:var(--sf);border-color:var(--ac)}
@media (max-width:820px){.c2,.c3,.split{grid-template-columns:1fr}body{font-size:17px}.brand{display:none}}
</style>

<script>
var D={"sl": {"3": {"n": 3, "t": "1. Masalah — Latar Belakang (1/4)", "s": "Masalah Umum: Berpikir Kritis, Motivasi, dan Capaian Sains", "h": "<p>Pendidikan abad ke-21 menuntut siswa tidak hanya menguasai konsep, tetapi juga mampu menganalisis informasi, mengevaluasi bukti, dan mengambil keputusan secara rasional. Kemampuan berpikir kritis merupakan kemampuan kognitif tingkat tinggi yang mencakup interpretasi, analisis, evaluasi, inferensi, penjelasan, dan regulasi diri (Facione, 2015). Kemampuan tersebut perlu didukung oleh motivasi belajar, yaitu dorongan yang membuat siswa memberi perhatian, merasa pembelajaran relevan, percaya diri, dan puas terhadap hasil belajarnya (Keller, 2010). Keduanya saling melengkapi: berpikir kritis memerlukan keterlibatan mental yang berkelanjutan, sedangkan motivasi belajar menentukan apakah siswa bersedia mempertahankan keterlibatan tersebut dalam pembelajaran sains.<\/p><p>Capaian pendidikan sains Indonesia menunjukkan bahwa penguatan kedua aspek tersebut masih diperlukan. Pada Programme for International Student Assessment (PISA) 2022, skor rata-rata sains siswa Indonesia sebesar 383, jauh di bawah rata-rata negara anggota OECD sebesar 485 (OECD, 2023). PISA tidak hanya menilai hafalan, tetapi menilai kemampuan siswa menjelaskan fenomena secara ilmiah, mengevaluasi dan merancang penyelidikan ilmiah, serta menafsirkan data dan bukti. Capaian tersebut mengindikasikan bahwa pembelajaran IPA perlu memberi ruang yang lebih besar bagi aktivitas penalaran, bukan hanya penyampaian informasi.<\/p><p>Kesulitan itu tampak jelas pada materi yang bersifat abstrak. Sistem pencernaan manusia dipelajari siswa kelas VIII (Fase D) dan melibatkan struktur yang tidak dapat diamati langsung, proses yang berlangsung berurutan di dalam tubuh, serta perbedaan antara pencernaan mekanik dan kimiawi yang melibatkan enzim. Siswa harus menghubungkan organ, enzim, zat makanan, dan hasil pencernaan dalam satu alur yang utuh. Rochmah et al. (2025) mengidentifikasi miskonsepsi 25 siswa kelas VIII dengan instrumen four-tier test dan melaporkan miskonsepsi pada materi sistem pencernaan sebesar 65,2%, di samping sistem peredaran darah (75,2%) dan sistem pernapasan (80%). Temuan tersebut berasal dari sampel kecil pada satu kelas dan dilaporkan dalam abstrak, sehingga dipakai sebagai indikasi awal, bukan sebagai angka nasional. Meskipun demikian, temuan itu menunjukkan bahwa konsep sistem tubuh manusia, termasuk sistem pencernaan, belum sepenuhnya dipahami siswa pada jenjang SMP.<\/p>"}, "4": {"n": 4, "t": "1. Masalah — Latar Belakang (2/4)", "s": "Masalah Spesifik: Konsep Abstrak dan Keterbatasan Visualisasi", "h": "<p>Konsep yang abstrak tersebut sulit dibangun apabila pembelajaran hanya mengandalkan gambar dua dimensi pada buku teks atau penjelasan lisan. Siswa tidak dapat melihat posisi organ dalam tiga dimensi, urutan perjalanan makanan, atau perubahan zat yang terjadi pada tiap organ. Ketika konsep tidak dapat divisualisasikan, siswa cenderung menghafal nama organ dan fungsinya tanpa memahami hubungan sebab-akibat antarproses. Pembelajaran yang demikian jarang memunculkan pertanyaan, argumentasi, atau evaluasi bukti, sehingga tidak banyak melatih berpikir kritis. Kondisi ini juga berpotensi menurunkan motivasi, karena siswa tidak melihat kaitan materi dengan kehidupan sehari-hari, seperti pola makan, kesehatan lambung, atau penyerapan nutrisi.<\/p><p>Augmented Reality (AR) merupakan teknologi yang menampilkan objek virtual, misalnya model tiga dimensi, pada lingkungan nyata secara interaktif, sehingga dapat membantu siswa memvisualisasikan konsep yang tidak teramati secara langsung. Hasil sintesis terhadap 46 artikel Scopus yang terbit tahun 2014–2023 menunjukkan bahwa integrasi AR dalam pembelajaran sains dapat meningkatkan keterampilan berpikir siswa, terutama berpikir kritis, khususnya ketika dipadukan dengan model pembelajaran seperti discovery learning, problem-based learning, dan inquiry (Kurniawan et al., 2024). Meta-analisis terhadap delapan artikel melaporkan bahwa AR meningkatkan kemampuan berpikir kritis siswa pada pembelajaran sains (Kusumaningrum et al., 2025). Pada jenjang yang sama dengan penelitian ini, Alkhabra et al. (2023) melaporkan bahwa retensi belajar dan berpikir kritis 120 siswa kelas VIII di Arab Saudi lebih baik setelah menggunakan konten AR dalam program STEAM.<\/p><p>AR juga dikaitkan dengan motivasi belajar. Meta-analisis terhadap 15 studi kuasi-eksperimen pada pembelajaran sains dan biologi melaporkan bahwa enam studi yang mengukur motivasi menghasilkan ukuran efek gabungan yang moderat dan positif (d ≈ 0,52), walaupun tidak semua studi menemukan manfaat tersebut dan jumlah studinya masih terbatas (Faria &amp; Miranda, 2024). Meta-analisis lain pada ilmu alam menunjukkan hasil yang berpihak pada kelompok AR untuk motivasi, keterlibatan, dan prestasi akademik, tetapi hanya berdasarkan empat studi (Soriano-Sánchez &amp; Jiménez-Vázquez, 2026). Dengan demikian, potensi AR terhadap motivasi dan berpikir kritis cukup menjanjikan, tetapi bukti pada konteks SMP di Indonesia untuk materi tertentu masih perlu diperkuat melalui pengujian yang terkontrol.<\/p>"}, "5": {"n": 5, "t": "1. Masalah — Latar Belakang (3/4)", "s": "Bukti AR: Penelitian Terdahulu dan Keterbatasannya", "h": "<p>Pada materi sistem pencernaan, pengembangan media AR sudah mulai dilakukan. Karentius dan Hardiyantari (2025) mengembangkan media AR interaktif dengan kuis dan visualisasi 3D organ pencernaan bagi siswa kelas VIII SMP menggunakan Multimedia Development Life Cycle (MDLC), dan melaporkan kelayakan yang sangat baik menurut ahli materi (91%), ahli media (75%), dan siswa (89%), serta N-Gain 0,80 pada kategori tinggi. Pada jenjang sekolah dasar, Pratama et al. (2026) melaporkan peningkatan rata-rata skor pemahaman 22 siswa kelas V dari 39,95 pada pratindakan menjadi 66,13 pada siklus I melalui penelitian tindakan kelas. Hasil pada jenjang sekolah dasar tersebut tidak digeneralisasi ke siswa SMP karena karakteristik siswa dan desain penelitiannya berbeda. Kedua penelitian di atas menitikberatkan pada pemahaman konsep, sedangkan berpikir kritis dan motivasi belajar tidak menjadi variabel utama yang diukur.<\/p><p>Dari sisi teknologi, banyak media AR dikembangkan sebagai aplikasi yang harus dipasang terlebih dahulu pada perangkat siswa, sehingga penggunaannya bergantung pada kapasitas penyimpanan, versi sistem operasi, dan keterampilan pemrograman pengembang. Kivicube merupakan platform pembuatan AR berbasis web yang menggunakan antarmuka seret-dan-lepas tanpa pemrograman, serta memungkinkan pengalaman AR dipublikasikan ke web tanpa memasang aplikasi (Kivicube, n.d.). Karakteristik ini relevan untuk sekolah dengan ragam perangkat siswa dan keterbatasan sumber daya, serta memudahkan guru memodifikasi konten. Penelitian pada jenjang SMP yang memakai AR berbasis web, yaitu MyWebAR pada materi tata surya di kelas VII, melaporkan peningkatan pemahaman konsep yang tinggi (N-Gain 0,92), tetapi dengan desain satu kelompok tanpa kelompok kontrol sehingga hasilnya belum dapat dipastikan berasal dari perlakuan (Firdaus et al., 2026).<\/p><p>Keterbatasan lain terletak pada rancangan pembelajarannya. Sari et al. (2024) melaporkan bahwa pendekatan saintifik berbantuan AR meningkatkan kemampuan berpikir kritis siswa pada pembelajaran matematika dengan desain kuasi-eksperimen, yang menunjukkan bahwa manfaat AR bergantung pada bagaimana AR dipadukan dengan aktivitas belajar. Pendekatan STEM (Science, Technology, Engineering, and Mathematics) mengintegrasikan konsep sains dengan teknologi, rekayasa, dan matematika dalam penyelesaian masalah kontekstual (Kelley &amp; Knowles, 2016). Meta-analisis terhadap 13 artikel melaporkan bahwa pembelajaran berbasis STEM dengan model REACT berpengaruh tinggi terhadap berpikir kritis (ES = 0,88), walaupun artikel yang dianalisis terbit pada tahun 2018–2019 (Putra et al., 2023). Pada materi sistem pencernaan, pendekatan STEM dapat diwujudkan, misalnya melalui penyelidikan kerja enzim (science), pemanfaatan AR untuk menelusuri organ dan proses (technology), perancangan model atau solusi pola makan sehat (engineering), serta perhitungan kebutuhan gizi atau pengukuran data (mathematics).<\/p>"}, "6": {"n": 6, "t": "1. Masalah — Latar Belakang (4/4)", "s": "Celah Penelitian dan Alasan Penelitian Dilakukan", "h": "<p>Berdasarkan penelusuran literatur yang dilakukan peneliti, terdapat tiga celah yang mendasari penelitian ini. Pertama, penelitian AR pada materi sistem pencernaan SMP yang ditemukan terutama melaporkan kelayakan produk dan penguasaan konsep (Karentius &amp; Hardiyantari, 2025), bukan berpikir kritis dan motivasi belajar secara bersamaan. Kedua, penelitian yang menguji AR berbasis web pada SMP umumnya menggunakan desain satu kelompok tanpa pembanding (Firdaus et al., 2026), sehingga efektivitasnya belum diuji terhadap pembelajaran konvensional. Ketiga, dalam penelusuran yang dapat dijangkau peneliti, belum ditemukan penelitian pada materi sistem pencernaan SMP yang menggunakan Kivicube dengan pendekatan STEM dan menguji dampaknya terhadap berpikir kritis serta motivasi belajar dengan kelompok kontrol. Penelusuran ini terbatas pada basis data terbuka, sehingga penelitian ini tidak mengklaim sebagai penelitian pertama, melainkan sebagai upaya melengkapi bukti pada kombinasi platform, pendekatan, materi, jenjang, dan variabel tersebut.<\/p><p>Berdasarkan uraian tersebut, diperlukan media pembelajaran AR yang tidak hanya menampilkan model tiga dimensi, tetapi juga dirancang bersama pendekatan STEM agar siswa terlibat dalam penyelidikan dan pemecahan masalah. Media tersebut perlu dikembangkan secara sistematis, diuji kepraktisannya oleh pengguna, dan diuji efektivitasnya terhadap kemampuan berpikir kritis serta motivasi belajar melalui perbandingan dengan pembelajaran konvensional. Penelitian ini menggunakan pendekatan Research and Development (R&amp;D) dengan model ADDIE (Branch, 2009), yang memungkinkan proses pengembangan, uji kepraktisan, dan uji efektivitas dilakukan dalam satu rangkaian, di mana tahap implementasi dan evaluasi memuat komponen kuantitatif berupa kuasi-eksperimen (Sugiyono, 2019).<\/p><p>Dengan demikian, penelitian berjudul “Pengembangan dan Uji Efektivitas Media Pembelajaran Augmented Reality Berbantuan Kivicube dengan Pendekatan STEM pada Materi Sistem Pencernaan Manusia untuk Meningkatkan Kemampuan Berpikir Kritis dan Motivasi Belajar Siswa Kelas VIII SMP” penting dilakukan. Hasil penelitian diharapkan memberikan produk media yang praktis digunakan guru dan siswa serta bukti empiris tentang dampaknya terhadap berpikir kritis dan motivasi belajar.<\/p>"}, "7": {"n": 7, "t": "1. Masalah — Identifikasi Masalah", "s": "Disusun dari latar belakang; setiap butir bersumber pada bukti pada slide Latar Belakang.", "h": "<ol><li>Capaian sains siswa Indonesia pada PISA 2022 masih jauh di bawah rata-rata OECD, sehingga pembelajaran IPA perlu memperkuat penalaran dan berpikir kritis (OECD, 2023).<\/li><li>Konsep sistem pencernaan manusia bersifat abstrak dan melibatkan proses mekanik dan kimiawi, sehingga siswa SMP masih mengalami miskonsepsi pada materi sistem tubuh manusia (Rochmah et al., 2025).<\/li><li>Pembelajaran yang bertumpu pada gambar dua dimensi dan penjelasan lisan belum memfasilitasi visualisasi tiga dimensi organ dan proses pencernaan serta kurang memberi ruang bagi penyelidikan dan evaluasi bukti.<\/li><li>Media AR pada materi sistem pencernaan yang ditemukan lebih banyak melaporkan kelayakan dan penguasaan konsep, sedangkan dampaknya terhadap berpikir kritis dan motivasi belajar belum menjadi fokus pengukuran (Karentius &amp; Hardiyantari, 2025).<\/li><li>Penelitian AR berbasis web pada jenjang SMP umumnya menggunakan desain satu kelompok tanpa kelompok kontrol, sehingga efektivitasnya dibandingkan pembelajaran konvensional belum dapat ditegaskan (Firdaus et al., 2026).<\/li><li>Media AR yang memadukan platform AR tanpa pemrograman seperti Kivicube dengan pendekatan STEM pada materi sistem pencernaan belum ditemukan dalam penelusuran literatur yang dilakukan peneliti.<\/li><\/ol>"}, "8": {"n": 8, "t": "2. Rumusan Masalah", "s": "Seluruh rumusan sesuai dengan latar belakang, identifikasi masalah, dan judul penelitian.", "h": "<ol><li>Bagaimana proses pengembangan media pembelajaran Augmented Reality (AR) berbantuan Kivicube dengan pendekatan STEM pada materi sistem pencernaan manusia untuk siswa kelas VIII SMP menggunakan model ADDIE?<\/li><li>Bagaimana kepraktisan media pembelajaran AR berbantuan Kivicube dengan pendekatan STEM pada materi sistem pencernaan manusia berdasarkan keterlaksanaan pembelajaran serta respons siswa dan guru?<\/li><li>Apakah terdapat perbedaan peningkatan kemampuan berpikir kritis siswa kelas VIII SMP antara kelompok yang belajar dengan media pembelajaran AR berbantuan Kivicube dengan pendekatan STEM dan kelompok yang belajar dengan pembelajaran konvensional pada materi sistem pencernaan manusia?<\/li><li>Apakah terdapat perbedaan peningkatan motivasi belajar siswa kelas VIII SMP antara kelompok yang belajar dengan media pembelajaran AR berbantuan Kivicube dengan pendekatan STEM dan kelompok yang belajar dengan pembelajaran konvensional pada materi sistem pencernaan manusia?<\/li><li>Apakah terdapat perbedaan peningkatan kemampuan berpikir kritis dan motivasi belajar siswa secara simultan antara kelompok yang belajar dengan media pembelajaran AR berbantuan Kivicube dengan pendekatan STEM dan kelompok yang belajar dengan pembelajaran konvensional?<\/li><\/ol>"}, "9": {"n": 9, "t": "3. Tujuan Penelitian", "s": "Setiap tujuan menjawab satu rumusan masalah dengan urutan yang sama.", "h": "<ol><li>Mendeskripsikan proses pengembangan media pembelajaran AR berbantuan Kivicube dengan pendekatan STEM pada materi sistem pencernaan manusia untuk siswa kelas VIII SMP menggunakan model ADDIE.<\/li><li>Mendeskripsikan kepraktisan media pembelajaran AR berbantuan Kivicube dengan pendekatan STEM berdasarkan keterlaksanaan pembelajaran serta respons siswa dan guru.<\/li><li>Menganalisis perbedaan peningkatan kemampuan berpikir kritis siswa antara kelompok yang belajar dengan media AR berbantuan Kivicube dengan pendekatan STEM dan kelompok yang belajar dengan pembelajaran konvensional.<\/li><li>Menganalisis perbedaan peningkatan motivasi belajar siswa antara kedua kelompok tersebut.<\/li><li>Menganalisis perbedaan peningkatan kemampuan berpikir kritis dan motivasi belajar siswa secara simultan antara kedua kelompok tersebut.<\/li><\/ol>"}, "10": {"n": 10, "t": "4. Kebaruan dan Celah Penelitian", "s": "Berdasarkan penelusuran peneliti pada basis data yang dapat diakses; tidak diklaim sebagai penelitian pertama.", "h": "<div class=\"tw\"><table><tr><th>Penelitian terdahulu<\/th><th>Yang sudah dilakukan<\/th><th>Yang belum dijawab<\/th><\/tr><tr><td>Karentius &amp; Hardiyantari (2025)<\/td><td>AR sistem pencernaan, kelas VIII SMP, R&amp;D MDLC; kelayakan sangat baik; N-Gain 0,80.<\/td><td>Berpikir kritis dan motivasi tidak diukur; bukan Kivicube; tanpa pendekatan STEM.<\/td><\/tr><tr><td>Firdaus et al. (2026)<\/td><td>AR berbasis web (MyWebAR), SMP kelas VII, N-Gain 0,92.<\/td><td>Satu kelompok tanpa kontrol; bukan Kivicube; materi tata surya.<\/td><\/tr><tr><td>Alkhabra et al. (2023)<\/td><td>AR dalam program STEAM, 120 siswa kelas VIII; berpikir kritis lebih baik.<\/td><td>Konteks Arab Saudi; motivasi tidak diukur; bukan sistem pencernaan.<\/td><\/tr><tr><td>Sari et al. (2024)<\/td><td>Pendekatan saintifik berbantuan AR meningkatkan berpikir kritis (kuasi-eksperimen).<\/td><td>Mata pelajaran matematika; bukan IPA, bukan Kivicube.<\/td><\/tr><tr><td>Faria &amp; Miranda (2024); Kusumaningrum et al. (2025)<\/td><td>Meta-analisis: AR berdampak positif pada motivasi (d ≈ 0,52) dan berpikir kritis.<\/td><td>Basis studi terbatas; tidak spesifik materi dan platform.<\/td><\/tr><\/table><\/div><p class=\"call\"><b>Posisi penelitian ini: mengembangkan media AR berbantuan Kivicube dengan pendekatan STEM pada materi sistem pencernaan, lalu menguji kepraktisan dan efektivitasnya terhadap berpikir kritis dan motivasi belajar siswa kelas VIII SMP dengan kelompok kontrol.<\/b><\/p>"}, "11": {"n": 11, "t": "Manfaat dan Batasan Masalah", "s": "Manfaat (teoretis dan praktis) serta ruang lingkup penelitian.", "h": "<div class=\"cols c2\"><section class=\"col\"><h3>Manfaat<\/h3><p>Secara teoretis, penelitian ini memperkaya kajian pengembangan media pembelajaran IPA berbasis AR, khususnya tentang integrasi platform AR tanpa pemrograman dengan pendekatan STEM, serta menambah bukti empiris tentang hubungan penggunaan AR dengan kemampuan berpikir kritis dan motivasi belajar pada materi sistem pencernaan manusia di jenjang SMP.<\/p><p><b>Bagi siswa:<\/b> memperoleh pengalaman belajar sistem pencernaan yang visual, interaktif, dan kontekstual sehingga membantu memahami konsep, melatih berpikir kritis, dan meningkatkan motivasi belajar.<\/p><p><b>Bagi guru:<\/b> memperoleh contoh media AR dan rancangan pembelajaran STEM yang siap digunakan dan dapat dimodifikasi tanpa keterampilan pemrograman.<\/p><p><b>Bagi sekolah:<\/b> memperoleh alternatif media pembelajaran berbasis teknologi yang dapat diakses melalui peramban pada perangkat yang tersedia serta bahan pertimbangan peningkatan mutu pembelajaran IPA.<\/p><p><b>Bagi Universitas Pendidikan Ganesha:<\/b> menambah hasil penelitian pengembangan media pembelajaran IPA yang dapat menjadi rujukan bagi mahasiswa dan dosen.<\/p><p><b>Bagi peneliti selanjutnya:<\/b> menjadi dasar untuk mengembangkan media serupa pada materi IPA lain, jenjang lain, atau dengan desain dan sampel yang lebih luas.<\/p><\/section><section class=\"col\"><h3>Batasan Masalah<\/h3><p>1. Media yang dikembangkan adalah media pembelajaran AR yang dibuat melalui platform Kivicube dan diakses melalui peramban pada gawai siswa atau perangkat sekolah.<\/p><p>2. Materi dibatasi pada sistem pencernaan manusia pada kelas VIII (Fase D), meliputi organ pencernaan, proses pencernaan mekanik dan kimiawi, enzim, penyerapan zat makanan, serta gangguan pada sistem pencernaan.<\/p><p>3. Model pengembangan yang digunakan adalah ADDIE; tahap implementasi dan evaluasi dibatasi pada uji kepraktisan dan uji efektivitas dalam satu siklus pembelajaran pada satu sekolah.<\/p><p>4. Kemampuan berpikir kritis diukur berdasarkan indikator Facione, yaitu interpretasi, analisis, evaluasi, inferensi, penjelasan, dan regulasi diri, menggunakan tes uraian.<\/p><p>5. Motivasi belajar diukur berdasarkan dimensi model ARCS (attention, relevance, confidence, satisfaction) menggunakan angket.<\/p><p>6. Efektivitas diuji dengan desain quasi-eksperimen nonequivalent control group dengan membandingkan satu kelas eksperimen dan satu kelas kontrol; kesimpulan tidak digeneralisasi di luar populasi penelitian.<\/p><\/section><\/div>"}, "12": {"n": 12, "t": "5. Landasan Teori (1/2): Berpikir Kritis dan Motivasi Belajar", "s": "Bab II 2.1.1–2.1.2", "h": "<p>Berpikir kritis adalah proses menilai informasi secara terarah dan beralasan untuk menentukan apa yang diyakini atau dilakukan. Facione (2015) menguraikan enam keterampilan inti berpikir kritis, yaitu interpretasi, analisis, evaluasi, inferensi, penjelasan, dan regulasi diri. Interpretasi berkaitan dengan memahami makna data atau informasi; analisis dengan mengidentifikasi hubungan antarpernyataan atau antarbagian; evaluasi dengan menilai kredibilitas pernyataan dan kekuatan argumen; inferensi dengan menarik kesimpulan yang beralasan; penjelasan dengan menyampaikan hasil penalaran beserta alasannya; dan regulasi diri dengan memantau serta mengoreksi proses berpikirnya sendiri.<\/p><p>Dalam pembelajaran IPA, berpikir kritis tampak ketika siswa membandingkan hasil pengamatan dengan prediksi, menjelaskan alasan terjadinya suatu proses, menilai kecukupan bukti, dan menarik kesimpulan. Pada materi sistem pencernaan, contohnya adalah menjelaskan mengapa karbohidrat mulai dicerna di mulut tetapi protein baru dicerna di lambung, menganalisis dampak kekurangan enzim terhadap penyerapan zat makanan, atau mengevaluasi klaim tentang pola makan dan gangguan lambung. Kemampuan tersebut tidak muncul secara otomatis, tetapi memerlukan pembelajaran yang menyediakan masalah bermakna, kesempatan menyelidiki, dan umpan balik. Karena itu, penelitian ini mengukur berpikir kritis menggunakan tes uraian yang disusun berdasarkan indikator Facione dan dikaitkan langsung dengan konteks sistem pencernaan.<\/p><p>Motivasi belajar adalah dorongan internal dan eksternal yang mengarahkan, mengaktifkan, dan mempertahankan perilaku belajar siswa. Keller (2010) mengembangkan model ARCS yang menyatakan bahwa motivasi belajar dapat dirancang melalui empat kategori strategi, yaitu attention (perhatian), relevance (relevansi), confidence (percaya diri), dan satisfaction (kepuasan). Perhatian muncul ketika pembelajaran menghadirkan hal baru, menantang rasa ingin tahu, dan bervariasi. Relevansi muncul ketika siswa melihat kaitan materi dengan kebutuhan, minat, dan pengalaman hidupnya. Percaya diri tumbuh ketika siswa memahami apa yang diharapkan dan merasakan keberhasilan yang dapat dicapai melalui usahanya. Kepuasan tercapai ketika siswa memperoleh pengakuan dan hasil yang sepadan dengan usahanya.<\/p><p>Model ARCS dipilih karena keempat dimensinya dapat diterjemahkan langsung ke dalam fitur media yang dikembangkan. Objek 3D yang muncul pada lingkungan nyata menarik perhatian, konteks kesehatan pencernaan menunjukkan relevansi, tugas bertahap pada aktivitas STEM menumbuhkan percaya diri, dan produk atau solusi yang dihasilkan siswa memberikan kepuasan. Oleh karena itu, motivasi belajar dalam penelitian ini diukur dengan angket berdasarkan keempat dimensi tersebut.<\/p>"}, "13": {"n": 13, "t": "5. Landasan Teori (2/2): Materi, STEM, AR, Kivicube, ADDIE", "s": "Bab II 2.1.3–2.1.8", "h": "<p><b>2.1.3 Materi.<\/b> Pembelajaran IPA di SMP bertujuan membekali siswa dengan pemahaman konsep dan keterampilan proses sains, seperti mengamati, mengklasifikasi, memprediksi, menyelidiki, dan menyimpulkan. Pembelajaran yang efektif memberi peluang siswa membangun pengetahuan melalui pengalaman, sejalan dengan pandangan konstruktivisme. Materi sistem pencernaan manusia dipelajari pada kelas VIII (Fase D) dan mencakup organ dan kelenjar pencernaan, proses pencernaan mekanik dan kimiawi, peran enzim, penyerapan zat makanan, serta gangguan atau penyakit pada sistem pencernaan. Materi ini menantang karena sifatnya yang abstrak dan berurutan. Rochmah et al. (2025) melaporkan bahwa pada 25 siswa kelas VIII yang diuji dengan four-tier test, miskonsepsi pada materi sistem pencernaan mencapai 65,2%. Temuan tersebut berasal dari sampel kecil sehingga digunakan sebagai gambaran awal. Karakteristik materi yang memuat organ tak teramati, proses mikroskopis, dan alur zat makanan menjadikan visualisasi tiga dimensi dan penyelidikan terstruktur sebagai kebutuhan pedagogis, bukan sekadar pelengkap.<\/p><p><b>2.1.4 STEM.<\/b> STEM merupakan akronim dari Science, Technology, Engineering, and Mathematics, yaitu pendekatan yang mengintegrasikan keempat bidang tersebut dalam penyelesaian masalah kontekstual. Kelley dan Knowles (2016) menyusun kerangka konseptual STEM terpadu yang menempatkan inkuiri sains, desain rekayasa, penerapan matematika, dan pemanfaatan teknologi sebagai unsur yang saling mendukung dalam situasi pembelajaran. Dengan pendekatan ini, siswa tidak mempelajari konsep secara terpisah, tetapi menggunakannya untuk menghasilkan penjelasan, rancangan, atau solusi atas masalah nyata.<\/p><p><b>2.1.5 AR.<\/b> Augmented Reality (AR) adalah teknologi yang menggabungkan objek virtual dengan lingkungan nyata dan memungkinkan pengguna berinteraksi dengan objek tersebut secara waktu nyata. Dalam pembelajaran, AR memungkinkan siswa memperbesar, memutar, dan menelusuri objek tiga dimensi, sehingga membantu memvisualisasikan konsep yang tidak dapat diamati langsung seperti organ dalam tubuh. Sintesis terhadap 46 artikel menunjukkan bahwa AR dalam pembelajaran sains dapat meningkatkan keterampilan berpikir, terutama berpikir kritis, dan bahwa pemaduan AR dengan model pembelajaran seperti discovery learning, problem-based learning, dan inquiry membuat pembelajaran lebih bermakna (Kurniawan et al., 2024).<\/p><p><b>2.1.6 Kivicube.<\/b> Kivicube adalah platform pembuatan AR berbasis web yang tidak memerlukan pemrograman. Pengembang membuat pengalaman AR melalui antarmuka seret-dan-lepas dengan templat dan pustaka aset, kemudian mempublikasikannya ke web sehingga pengguna dapat mengaksesnya tanpa memasang aplikasi tambahan (Kivicube, n.d.). Dokumentasi platform mencantumkan beberapa jenis adegan AR, antara lain Image AR, Plane AR, Face AR, dan 3D Interaction. Penelitian ini memanfaatkan kemampuan platform untuk menampilkan model tiga dimensi organ pencernaan dan elemen interaktif yang dapat dipindai siswa melalui peramban pada gawai.<\/p><p><b>2.1.7 Media.<\/b> Media yang dikembangkan terdiri atas (1) objek AR berbantuan Kivicube yang menampilkan model 3D organ pencernaan, urutan perjalanan makanan, dan penanda proses mekanik dan kimiawi; (2) modul atau Lembar Kerja Peserta Didik (LKPD) berpendekatan STEM yang memuat masalah kontekstual, langkah penyelidikan, tugas rekayasa, dan tugas matematis; serta (3) panduan guru. Media tidak dimaksudkan menggantikan guru, tetapi menjadi sarana siswa menyelidiki, menjelaskan, dan mengevaluasi konsep. Rancangan aktivitas STEM yang direncanakan disajikan pada Tabel 2.1.<\/p><p><b>2.1.8 ADDIE.<\/b> ADDIE merupakan model perancangan pembelajaran sistematis yang terdiri atas lima tahap, yaitu Analysis, Design, Development, Implementation, dan Evaluation (Branch, 2009). Pada tahap analisis, peneliti mengidentifikasi kebutuhan, karakteristik siswa, kompetensi, dan kondisi sarana. Pada tahap desain, peneliti merancang tujuan, struktur media, storyboard, dan instrumen. Pada tahap pengembangan, produk dibuat dan diuji coba awal serta direvisi. Pada tahap implementasi, produk digunakan dalam pembelajaran sesungguhnya. Pada tahap evaluasi, dilakukan penilaian proses dan hasil untuk menyimpulkan kepraktisan serta efektivitas. Model ADDIE dipilih karena tahapannya jelas dan implementasinya dapat dipadukan dengan desain quasi-eksperimen sebagai komponen kuantitatif (Sugiyono, 2019).<\/p>"}, "14": {"n": 14, "t": "6. Hipotesis Penelitian", "s": "Rumusan masalah 3–5 diuji secara statistik; rumusan 1–2 dijawab secara deskriptif.", "h": "<div class=\"cols c3\"><section class=\"col\"><h3>Hipotesis 1 — Berpikir kritis<\/h3><p><b>H0:<\/b> Tidak terdapat perbedaan peningkatan kemampuan berpikir kritis siswa antara kelompok yang belajar dengan media AR berbantuan Kivicube dengan pendekatan STEM dan kelompok yang belajar dengan pembelajaran konvensional.<\/p><p><b>H1:<\/b> Terdapat perbedaan peningkatan kemampuan berpikir kritis siswa antara kelompok yang belajar dengan media AR berbantuan Kivicube dengan pendekatan STEM dan kelompok yang belajar dengan pembelajaran konvensional.<\/p><\/section><section class=\"col\"><h3>Hipotesis 2 — Motivasi belajar<\/h3><p><b>H0:<\/b> Tidak terdapat perbedaan peningkatan kemampuan berpikir kritis siswa antara kelompok yang belajar dengan media AR berbantuan Kivicube dengan pendekatan STEM dan kelompok yang belajar dengan pembelajaran konvensional.<\/p><p><b>H1:<\/b> Terdapat perbedaan peningkatan kemampuan berpikir kritis siswa antara kelompok yang belajar dengan media AR berbantuan Kivicube dengan pendekatan STEM dan kelompok yang belajar dengan pembelajaran konvensional.<\/p><\/section><section class=\"col\"><h3>Hipotesis 3 — Simultan (berpikir kritis dan motivasi)<\/h3><p><b>H0:<\/b> Tidak terdapat perbedaan peningkatan kemampuan berpikir kritis siswa antara kelompok yang belajar dengan media AR berbantuan Kivicube dengan pendekatan STEM dan kelompok yang belajar dengan pembelajaran konvensional.<\/p><p><b>H1:<\/b> Terdapat perbedaan peningkatan kemampuan berpikir kritis siswa antara kelompok yang belajar dengan media AR berbantuan Kivicube dengan pendekatan STEM dan kelompok yang belajar dengan pembelajaran konvensional.<\/p><\/section><\/div>"}, "15": {"n": 15, "t": "Kerangka Berpikir", "s": "Alur dari kondisi awal, pengembangan, perlakuan, pengukuran, sampai kondisi akhir.", "h": "<div class=\"split\"><img class=\"fig\" alt=\"Gambar slide 15\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABMcAAAWSCAYAAAATp4KnAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAewgAAHsIBbtB1PgABAABJREFUeJzs3XdUFcf7P/D3pUoRlCaKgghqFCsWEMTeRU3EjjUkxpJEo0mMiSW2+DExMTGJJlFjTcQSe2+oWFBAUVDEhtKkd+kwvz/43fnucvcWiiLyvM7hnHu5s7OzffbZ2RkZY4yBEEIIIYQQQgghhJBaSKu6C0AIIYQQQgghhBBCSHWh4BghhBBCCCGEEEIIqbUoOEYIIYQQQgghhBBCai0KjhFCCCGEEEIIIYSQWouCY4QQQgghhBBCCCGk1qLgGCGEEEIIIYQQQgiptSg4RgghhBBCCCGEEEJqLQqOEUIIIYQQQgghhJBai4JjhBBCCCGEEEIIIaTWouAYIYQQQgghhBBCCKm1KDhGCCGEEEIIIYQQQmotCo4RQgghhBBCCCGEkFqLgmOEEEIIIYQQQgghpNai4BghhBBCCCGEEEIIqbUoOEYIIYQQQgghhBBCai0KjhFCCCGEEEIIIYSQWouCY4QQQgghhBBCCCGk1qLgGCGEEEIIIYQQQgiptSg4RgghhBBCCCGEEEJqLQqOEUIIIYQQQgghhJBai4JjhBBCCCGEEEIIIaTWouAYIYQQQgghhBBCCKm1KDhGCCGEEEIIIYQQQmotCo4RQgghhBBCCCGEkFqLgmOEEEIIIYQQQgghpNai4BghhBBCCCGEEEIIqbUoOEYIIYQQQgghhBBCai0KjhFCCCGEEEIIIYSQWouCY4QQQgghhBBCCCGk1qLgGCGEEEIIIYQQQgiptSg4RgghhBBCCCGEEEJqLZ3qLkBtUlhYiIcPHyI0NBR3797FgwcPkJGRgZycHOTl5VV38QghhBBCCCGEEPIa6ejowNDQEIaGhrC1tUW7du3Qtm1btG3bFvXr16/u4tUaFBx7xVJTU7F161b8+++/CAsLQ0FBQXUXiRBCCCGEEEIIIW+4xo0bo1+/fpg1axa6dOlS3cV5q8kYY6y6C/E2CgwMxIYNG+Dr60utwgghhBBCCCGEEFJhnTt3xqxZszB27FgYGhpWd3HeOhQcq2LJycmYOnUqjh8/rjJds2bN0KZNGzRo0ACGhoaoU6cOZDLZayolIYQQQgghhBBCqlthYSFyc3ORmZmJiIgIhIWFITc3V2l6S0tLbN++HYMHD36NpXz7UXCsCvn7+2P8+PGIjY1V+K1Xr14YO3YsOnToACcnJ9StW7caSkgIIYQQQgghhJA3VXFxMZ4+fYq7d+/iwoUL2LlzJ7KyshTSffnll1i5ciV0dXWroZRvHwqOVYGSkhL873//w5IlS1BcXMz/X7duXUyZMgUzZ85E69atq7GEhBBCCCGEEEIIqWmys7Pxzz//YMOGDbh7967oNzc3N+zevRu2trbVVLq3BwXHqsDixYuxcuVK0f+GDh2Kbdu2w erbantuan Kivicube dengan pendekatan STEM melalui tahapan ADDIE. Media tersebut kemudian diuji kepraktisannya dan diimplementasikan pada kelompok eksperimen, sedangkan kelompok kontrol menerima pembelajaran konvensional. Kedua kelompok diukur dengan pretest dan posttest berpikir kritis dan motivasi belajar. Kondisi akhir yang diharapkan adalah media praktis digunakan dan peningkatan berpikir kritis serta motivasi belajar kelompok eksperimen lebih tinggi daripada kelompok kontrol. Kerangka tersebut digambarkan pada Gambar 2.1.<\/p><\/div><\/div>"}, "16": {"n": 16, "t": "7. Desain Penelitian", "s": "Bab III 3.1–3.2: R&D model ADDIE dengan komponen kuantitatif.", "h": "<div class=\"split\"><img class=\"fig\" alt=\"Gambar slide 16\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABI8AAAWSCAYAAACeysXzAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAewgAAHsIBbtB1PgABAABJREFUeJzs3XdUFNffBvCHJkgvIth772IsWLD3Hg22RI1dE41RE035EdOMxkQTY42xxC6W2BO7Ihawo2IFO4IFKdLhvn9w9r477M7ughTL8zlnz9mduXPnzuzU79y510wIIUBERERERERERKSHeUEXgIiIiIiIiIiIXl0MHhERERERERERkSoGj4iIiIiIiIiISBWDR0REREREREREpIrBIyIiIiIiIiIiUsXgERERERERERERqWLwiIiIiIiIiIiIVDF4REREREREREREqhg8IiIiIiIiIiIiVQweERERERERERGRKgaPiIiIiIiIiIhIFYNHRERERERERESkisEjIiIiIiIiIiJSxeARERERERERERGpYvCIiIiIiIiIiIhUMXhERERERERERESqGDwiIiIiIiIiIiJVDB4REREREREREZEqBo+IiIiIiIiIiEgVg0dERERERERERKSKwSMiIiIiIiIiIlLF4BEREREREREREali8IiIiIiIiIiIiFQxeERERERERERERKoYPCIiIiIiIiIiIlUMHhERERERERERkSoGj4iIiIiIiIiISBWDR0REREREREREpIrBIyIiIiIiIiIiUsXgERERERERERERqWLwiIiIiIiIiIiIVFkWdAEKUlpaGm7evImQkBBcvHgRoaGheP78ORISEpCYmFjQxSMiIiIiIiKifGRhYQFbW1vY2dmhRIkSqFWrFmrXro1atWqhSJEiBV28AvPWBY9iY2OxatUq/P3337h48SKSkpIKukhERERERERE9IorVqwYWrVqhdGjR6NZs2YwMzMr6CLlGzMhhCjoQuSHixcvYsGCBVi9ejVevHhR0MUhIiIiIiIiotdUzZo1MXbsWAwaNAgODg4FXZw898YHj2JjYzFq1CisX7/eYLoyZcqgVq1aKFasGGxtbWFjY/NWRRGJiIiIiIiI3napqalITExEXFwcbty4gUuXLiE+Pl41vZOTE/7880/07ds3H0uZ/97o4NGZM2fg6+uLW7du6Yxr3LgxBg4ciHr16qFmzZpwcnIqgBISERERERER0 iIiIiIiUsTgERERERERERERKWLwiIiIiIiIiIiIFDF4REREREREREREihg8IiIiIiIiIiIiRQweERERERERERGRIgaPiIiIiIiIiIhIEYNHRERERERERESkiMEjIiIiIiIiIiJSxOAREREREREREREpYvCIiIiIiIiIiIgUMXhERERERERERESKGDwiIiIiIiIiIiJFDB4REREREREREZEiBo+IiIiIiIiIiEgRg0dERERERERERKSIwSMiIiIiIiIiIlLE4BERERERERERESli8IiIiIiIiIiIiBT9H0QpTEm7cXNiAAAAAElFTkSuQmCC\"><div><p>Penelitian ini merupakan penelitian dan pengembangan (Research and Development/R&amp;D) yang mengembangkan produk berupa media pembelajaran AR berbantuan Kivicube dengan pendekatan STEM, lalu menguji kualitas produk tersebut (Sugiyono, 2019). Model pengembangan yang digunakan adalah ADDIE yang terdiri atas tahap Analysis, Design, Development, Implementation, dan Evaluation (Branch, 2009). Model ini dipilih karena tahapannya sederhana dan berurutan sehingga sesuai untuk penelitian skripsi dengan satu produk dan satu siklus uji, serta karena tahap implementasi dapat dilaksanakan sebagai eksperimen terkontrol.<\/p><p>Peneliti menganalisis (1) kebutuhan, melalui wawancara dengan guru IPA dan angket singkat siswa tentang kesulitan materi sistem pencernaan, media yang digunakan, dan kepemilikan perangkat; (2) kurikulum, yaitu Capaian Pembelajaran dan tujuan pembelajaran materi sistem pencernaan Fase D; (3) karakteristik siswa kelas VIII; serta (4) kondisi sarana, meliputi perangkat, peramban, dan koneksi internet sekolah, termasuk pemeriksaan persyaratan platform Kivicube. Hasil analisis ini menentukan cakupan materi dan bentuk media dan akan dilaporkan pada BAB IV.<\/p><p>Peneliti menyusun tujuan pembelajaran, peta konsep materi, storyboard adegan AR (organ, urutan pencernaan, mekanik dan kimiawi, enzim, penyerapan, gangguan pencernaan), rancangan LKPD berpendekatan STEM, rencana pelaksanaan pembelajaran (modul ajar) untuk kelas eksperimen dan kontrol, serta kisi-kisi instrumen berpikir kritis, motivasi belajar, dan kepraktisan.<\/p><p>Peneliti membuat adegan AR pada Kivicube, menyiapkan aset model 3D, menyusun LKPD dan panduan guru, lalu melakukan validasi isi terhadap media, perangkat, dan instrumen menggunakan lembar penilaian dan koefisien Aiken’s V. Hasil penilaian dan saran dipakai untuk merevisi produk. Setelah itu, dilakukan uji coba terbatas pada sejumlah siswa kelas VIII di luar kelas eksperimen dan kontrol untuk memeriksa keterbacaan, kemudahan pemindaian, dan kendala teknis sebelum implementasi.<\/p><p>Produk diterapkan pada kelas eksperimen dalam empat pertemuan sesuai alur materi. Tiap pertemuan memuat orientasi masalah kontekstual, penyelidikan dengan media AR, tugas rekayasa, tugas matematis, presentasi, dan refleksi. Kelas kontrol belajar materi yang sama dengan pembelajaran konvensional. Pretest dan angket motivasi diberikan sebelum pertemuan pertama, sedangkan posttest dan angket motivasi diberikan setelah pertemuan terakhir. Keterlaksanaan pembelajaran dicatat oleh observer.<\/p><p>Evaluasi dilakukan pada setiap tahap (formatif) dan pada akhir penelitian (sumatif). Evaluasi sumatif meliputi analisis kepraktisan berdasarkan keterlaksanaan pembelajaran serta respons siswa dan guru, dan analisis efektivitas berdasarkan peningkatan berpikir kritis dan motivasi belajar. Hasil evaluasi menjadi dasar revisi akhir produk dan penarikan simpulan.<\/p><\/div><\/div>"}, "17": {"n": 17, "t": "8. Subjek: Tempat, Populasi, dan Sampel", "s": "Bab III 3.3. Nama sekolah akan ditetapkan sesuai izin penelitian.", "h": "<p><b>Tempat dan waktu.<\/b> Penelitian direncanakan dilaksanakan pada salah satu SMP Negeri di Kabupaten Buleleng, Provinsi Bali, pada semester genap tahun ajaran 2026/2027. Sekolah akan ditetapkan berdasarkan izin penelitian dan kesediaan guru IPA kelas VIII untuk berpartisipasi.<\/p><p><b>Populasi.<\/b> Populasi dalam penelitian ini adalah seluruh siswa kelas VIII pada sekolah yang menjadi lokasi penelitian pada tahun ajaran 2026/2027. Siswa kelas VIII dipilih karena materi sistem pencernaan manusia diajarkan pada kelas VIII (Fase D).<\/p><p><b>Sampel.<\/b> Sampel uji efektivitas dipilih dengan teknik purposive sampling, yaitu penentuan sampel berdasarkan pertimbangan tertentu (Sugiyono, 2019). Pertimbangan meliputi kesetaraan kemampuan akademik antarkelas berdasarkan nilai IPA semester sebelumnya, kelas diajar oleh guru yang sama, serta ketersediaan perangkat untuk mengakses media AR. Dipilih dua kelas paralel: satu kelas sebagai kelompok eksperimen dan satu kelas sebagai kelompok kontrol yang ditentukan melalui undian. Kesetaraan awal diuji melalui pretest. Sampel lain yang dilibatkan adalah siswa kelas VIII di luar kelas eksperimen dan kontrol untuk uji coba terbatas, siswa kelas IX yang telah mempelajari materi untuk uji coba instrumen, serta guru IPA sebagai responden kepraktisan. Jumlah siswa pada tiap kelompok akan ditetapkan sesuai jumlah siswa kelas terpilih dan dicantumkan pada laporan hasil penelitian.<\/p>"}, "18": {"n": 18, "t": "9. Perlakuan: Media AR Kivicube + STEM vs Konvensional", "s": "Variabel: X = model pembelajaran; Y1 = berpikir kritis; Y2 = motivasi belajar.", "h": "<div class=\"tw\"><table><tr><th>Komponen STEM<\/th><th>Aktivitas Siswa<\/th><th>Peran Media AR Kivicube<\/th><\/tr><tr><td>Science<\/td><td>Menyelidiki kerja enzim amilase pada pati dan membandingkan pencernaan mekanik dengan kimiawi.<\/td><td>Visualisasi 3D organ dan lokasi kerja enzim pada tiap organ.<\/td><\/tr><tr><td>Technology<\/td><td>Memindai penanda untuk menjelajahi organ dan alur pencernaan; mencatat temuan.<\/td><td>Platform AR sebagai sumber belajar interaktif tanpa pemasangan aplikasi.<\/td><\/tr><tr><td>Engineering<\/td><td>Merancang model sederhana saluran pencernaan atau menu sehat untuk mengatasi masalah pencernaan.<\/td><td>Acuan struktur dan fungsi organ untuk merancang dan mengevaluasi rancangan.<\/td><\/tr><tr><td>Mathematics<\/td><td>Menghitung kebutuhan energi atau membandingkan data waktu dan hasil penyelidikan.<\/td><td>Menyajikan data atau konteks yang dapat dihitung dan dibandingkan.<\/td><\/tr><\/table><\/div><p>Produk diterapkan pada kelas eksperimen dalam empat pertemuan sesuai alur materi. Tiap pertemuan memuat orientasi masalah kontekstual, penyelidikan dengan media AR, tugas rekayasa, tugas matematis, presentasi, dan refleksi. Kelas kontrol belajar materi yang sama dengan pembelajaran konvensional. Pretest dan angket motivasi diberikan sebelum pertemuan pertama, sedangkan posttest dan angket motivasi diberikan setelah pertemuan terakhir. Keterlaksanaan pembelajaran dicatat oleh observer.<\/p><p>Pembelajaran konvensional dalam penelitian ini adalah pembelajaran IPA yang biasa dilakukan guru, umumnya berupa penjelasan, diskusi, tanya jawab, dan penggunaan buku teks atau gambar dua dimensi tanpa media AR dan tanpa rancangan aktivitas STEM. Kelompok kontrol mempelajari materi, alokasi waktu, dan tujuan pembelajaran yang sama dengan kelompok eksperimen agar perbedaan hasil dapat dikaitkan dengan perlakuan.<\/p>"}, "19": {"n": 19, "t": "10. Instrumen dan Validasi", "s": "Bab III 3.5–3.6", "h": "<div class=\"cols c3\"><section class=\"col\"><h3>Tes berpikir kritis<\/h3><p>Kemampuan berpikir kritis diukur dengan tes uraian pada materi sistem pencernaan yang diberikan sebagai pretest dan posttest dengan soal paralel. Soal berbentuk kasus atau data kontekstual, misalnya hasil uji enzim atau pola makan, dan dinilai dengan rubrik analitik per indikator. Kisi-kisi tes disajikan pada Tabel 3.3.<\/p><p class=\"call\">Indikator Facione: interpretasi (2), analisis (2), evaluasi (2), inferensi (2), penjelasan (1), regulasi diri (1) = 10 butir uraian (rancangan akhir).<\/p><\/section><section class=\"col\"><h3>Angket motivasi (ARCS) dan kepraktisan<\/h3><p>Motivasi belajar diukur dengan angket skala Likert empat pilihan (sangat tidak setuju sampai sangat setuju) berdasarkan dimensi ARCS (Keller, 2010), masing-masing dimensi memuat butir pernyataan positif dan negatif. Angket diberikan sebelum dan sesudah perlakuan pada kedua kelompok. Kisi-kisi angket disajikan pada Tabel 3.4.<\/p><p class=\"call\">Dimensi attention, relevance, confidence, satisfaction masing-masing 7 butir (28 butir).<\/p><p>Kepraktisan dikumpulkan melalui tiga instrumen: lembar observasi keterlaksanaan pembelajaran yang diisi observer, angket respons siswa kelas eksperimen, dan angket respons guru IPA. Aspek yang dinilai meliputi kemudahan akses dan penggunaan media, kejelasan petunjuk, kemenarikan, kebermanfaatan untuk memahami materi, dan kesesuaian waktu. Penilaian menggunakan skala Likert.<\/p><\/section><section class=\"col\"><h3>Validitas dan reliabilitas<\/h3><p>Validitas isi instrumen tes, angket, serta media dan perangkat pembelajaran dinilai menggunakan lembar penilaian berskala dan dihitung dengan koefisien Aiken’s V (Aiken, 1985). Butir atau komponen dengan nilai V di bawah batas yang ditetapkan direvisi sebelum digunakan. Selanjutnya, tes dan angket diuji coba pada siswa kelas IX yang telah mempelajari materi sistem pencernaan.<\/p><p>Validitas empiris butir dianalisis dengan korelasi Pearson product moment antara skor butir dan skor total, dengan butir dinyatakan valid jika r hitung lebih besar daripada r tabel pada taraf signifikansi 5%. Untuk tes uraian juga dihitung tingkat kesukaran dan daya beda butir. Reliabilitas dihitung dengan koefisien Cronbach’s Alpha, dengan instrumen dinyatakan reliabel jika nilai alpha sekurang-kurangnya 0,70. Perhitungan menggunakan program SPSS atau perangkat lunak setara. Hasil uji validitas dan reliabilitas dilaporkan pada BAB IV.<\/p><\/section><\/div>"}, "20": {"n": 20, "t": "11. Analisis Data", "s": "Bab III 3.7: kriteria N-Gain, uji prasyarat, dan uji hipotesis.", "h": "<div class=\"tw\"><table><tr><th>RM<\/th><th>Data<\/th><th>Teknik Analisis<\/th><th>Kriteria<\/th><\/tr><tr><td>1<\/td><td>Dokumentasi tahap ADDIE, hasil analisis kebutuhan, revisi.<\/td><td>Deskriptif kualitatif<\/td><td>Kelengkapan tahapan<\/td><\/tr><tr><td>2<\/td><td>Keterlaksanaan, respons siswa dan guru.<\/td><td>Persentase skor<\/td><td>Tabel 3.5<\/td><\/tr><tr><td>3<\/td><td>N-Gain berpikir kritis.<\/td><td>Uji t independen / Mann-Whitney U<\/td><td>Sig. &lt; 0,05<\/td><\/tr><tr><td>4<\/td><td>N-Gain motivasi belajar.<\/td><td>Uji t independen / Mann-Whitney U<\/td><td>Sig. &lt; 0,05<\/td><\/tr><tr><td>5<\/td><td>N-Gain berpikir kritis dan motivasi belajar.<\/td><td>MANOVA (Wilks’ Lambda)<\/td><td>Sig. &lt; 0,05<\/td><\/tr><\/table><\/div><p>Peningkatan kemampuan berpikir kritis dan motivasi belajar dihitung menggunakan N-Gain, yaitu selisih skor posttest dan pretest dibagi selisih skor maksimum dan pretest (Hake, 1998). Kategori N-Gain disajikan pada Tabel 3.6. N-Gain digunakan sebagai data untuk menguji perbedaan antarkelompok karena mempertimbangkan kemampuan awal.<\/p><p>Sebelum uji hipotesis dilakukan uji prasyarat: (1) uji normalitas Shapiro-Wilk pada data N-Gain tiap kelompok; (2) uji homogenitas varians dengan Levene; (3) uji kesetaraan awal kedua kelompok dengan uji t sampel independen pada data pretest; dan (4) untuk uji simultan, uji homogenitas matriks kovarians (Box’s M) serta pemeriksaan korelasi antarvariabel terikat. Taraf signifikansi yang digunakan adalah 0,05.<\/p><p>Hipotesis pertama dan kedua (perbedaan N-Gain berpikir kritis dan N-Gain motivasi belajar antarkelompok) diuji dengan uji t sampel independen jika data normal dan homogen, atau uji Mann-Whitney U jika asumsi tidak terpenuhi. Hipotesis ketiga (perbedaan secara simultan) diuji dengan MANOVA menggunakan statistik Wilks’ Lambda dengan dua variabel terikat, yaitu N-Gain berpikir kritis dan N-Gain motivasi belajar. H0 ditolak jika nilai signifikansi kurang dari 0,05. Besar efek dilaporkan dengan Cohen’s d atau eta kuadrat parsial untuk melengkapi uji signifikansi. Ringkasan teknik analisis disajikan pada Tabel 3.7.<\/p>"}, "21": {"n": 21, "t": "12. Jadwal Penelitian", "s": "Bab III 3.8: Nopember 2026 – Juni 2027.", "h": "<div class=\"tw\"><table><tr><th>Kegiatan<\/th><th>Nov<\/th><th>Des<\/th><th>Jan<\/th><th>Feb<\/th><th>Mar<\/th><th>Apr<\/th><th>Mei<\/th><t function chrome(n){
 var b=bab(n);
 bar.innerHTML=TABS.map(function(t){return '<button data-p="'+t[2]+'" class="'+(t[0]===b?"on":"")+'">'+t[1]+"</button>"}).join("")+'<span class="sp"></span><span class="brand">Research Canvas Skripsi • Pendidikan IPA • Undiksha</span><button id="fs" title="Layar penuh">⛶</button>';
 foot.innerHTML='<button data-p="'+(n-1)+'"'+(n<=2?" disabled":"")+'>◀ Sebelumnya</button><button data-p="2">▣ Canvas</button><span class="pg">'+n+" / "+TOT+'</span><button class="go" data-p="'+(n+1)+'"'+(n>=TOT?" disabled":"")+'>Berikutnya ▶</button>';
 pr.style.width=(n/TOT*100)+"%";
}
function show(n){
 n=Math.max(2,Math.min(TOT,n||2));window.scrollTo(0,0);chrome(n);
 if(n===2){
  app.innerHTML='<div class="cover"><div class="eyebrow">RESEARCH CANVAS SKRIPSI</div><h1>Pengembangan dan Uji Efektivitas Media Pembelajaran Augmented Reality Berbantuan Kivicube dengan Pendekatan STEM pada Materi Sistem Pencernaan Manusia untuk Meningkatkan Kemampuan Berpikir Kritis dan Motivasi Belajar Siswa Kelas VIII SMP</h1><div class="meta">Program Studi Pendidikan IPA • Universitas Pendidikan Ganesha • Bab I–III<br>R&amp;D model ADDIE dengan uji efektivitas kuantitatif (quasi-eksperimen)</div><button class="btn" data-p="3">Mulai ▶</button></div><p class="hint">Klik blok mana pun untuk membuka isi lengkapnya. Anak panah ← → di keyboard juga berfungsi.</p><div class="grid">'+D.ti.map(function(t,i){var m=/^(\d+)\s+(.*)$/.exec(t);return '<button class="card" data-p="'+FIRST[i]+'"><span class="n">'+m[1]+'</span><h3>'+E(m[2])+'</h3><p>'+E(D.su[i])+'</p></button>'}).join("")+"</div>";
  return}
 var s=SL[n];
 app.innerHTML='<article class="page"><h2>'+E(s.t)+'</h2><p class="sub">'+E(s.s)+"</p>"+s.h+"</article>";
}
function go(n){location.hash=n<=2?"":"p"+n;}
function cur(){var m=/^#p(\d+)$/.exec(location.hash);return m?+m[1]:2}
document.addEventListener("click",function(e){
 if(e.target.closest("#fs")){var d=document.documentElement;try{document.fullscreenElement?document.exitFullscreen():d.requestFullscreen()}catch(x){}return}
 var t=e.target.closest("[data-p]");if(!t||t.disabled)return;go(+t.dataset.p)});
document.addEventListener("keydown",function(e){
 if(e.key==="ArrowRight"||e.key==="PageDown")go(cur()+1);
 else if(e.key==="ArrowLeft"||e.key==="PageUp")go(cur()-1)});
window.addEventListener("hashchange",function(){show(cur())});
show(cur());
</script>
